syntax = "proto3";

package user;
option go_package = "./pb";

message RegisterReq {
  string username = 1;
  string password = 2;
}

message RegisterResp {
  int64 code = 1;
  string msg = 2;
}

message LoginReq {
  string username = 1;
  string password = 2;
}

message LoginResp {
  int64 code = 1;
  string msg = 2;
  uint64 user_id = 3;
  string username = 4;
}

service User {
  rpc Register(RegisterReq) returns (RegisterResp);
  rpc Login(LoginReq) returns (LoginResp);
}