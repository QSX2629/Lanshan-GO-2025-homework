services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: aim
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  user:
    build:
      context: .
      dockerfile: docker/Dockerfile.user
    ports:
      - "50051:50051"
    depends_on:
      mysql:
        condition: service_healthy

  message:
    build:
      context: .
      dockerfile: docker/Dockerfile.message
    ports:
      - "50052:50052"
    depends_on:
      mysql:
        condition: service_healthy

  relation:
    build:
      context: .
      dockerfile: docker/Dockerfile.relation
    ports:
      - "50053:50053"
    depends_on:
      mysql:
        condition: service_healthy

  ai:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    ports:
      - "50054:50054"
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy

  file:
    build:
      context: .
      dockerfile: docker/Dockerfile.file
    ports:
      - "50055:50055"
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
