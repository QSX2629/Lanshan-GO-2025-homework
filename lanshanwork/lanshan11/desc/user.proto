syntax = "proto3";

package pb;
option go_package = "./;pb"; // 生成的pb.go包名是pb

// 1. 注册请求
message RegisterReq {
  string username = 1; // 字段名：username（小写，生成后会转为Username）
  string password = 2; // 字段名：password（小写，生成后会转为Password）
}

// 2. 注册响应
message RegisterResp {
  int32 code = 1; // 状态码：0成功，1失败
  string msg = 2; // 提示信息
}

// 3. 登录请求
message LoginReq {
  string username = 1; // 必须定义username字段
  string password = 2; // 必须定义password字段
}

// 4. 登录响应（补充Token字段）
message LoginResp {
  int32 code = 1;
  string msg = 2;
  string access_token = 3;   // 访问令牌
  string refresh_token = 4;  // 刷新令牌
  int64 expire_at = 5;       // 过期时间
}

// 5. RPC服务定义
service User {
  rpc Register(RegisterReq) returns (RegisterResp);
  rpc Login(LoginReq) returns (LoginResp);
}